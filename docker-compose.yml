version: '3.9'

services:
  # ─── MySQL Database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: cloudhire_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cloudhire_db}
      MYSQL_USER: ${DB_USER:-cloudhire_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cloudhire_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-cloudhire_user}", "-p${DB_PASSWORD:-cloudhire_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudhire_net

  # ─── Django Backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudhire_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudhire_net
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn cloudhire_project.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  # ─── React Frontend ───────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api
    container_name: cloudhire_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudhire_net

volumes:
  mysql_data:

networks:
  cloudhire_net:
    driver: bridge
